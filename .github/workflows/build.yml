name: Zbuduj APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Klucz podpisu z sekretów
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu SIGNING_KEYSTORE_BASE64 – dodaj sekrety podpisu (README, sekcja Aktualizacje)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dom.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/dom.jks" >> "$GITHUB_ENV"

      - name: Budowanie
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Optymalizacja R8 na razie tylko w wersji testowej (gałąź dev).
          MINIFY: ${{ github.ref == 'refs/heads/dev' && '1' || '0' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dom-launcher.apk

      # Gałąź dev służy tylko do sprawdzenia, czy się kompiluje – APK jako artefakt, bez wydania.
      - name: APK testowy (gałąź dev)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dom-launcher-test
          path: dom-launcher.apk
          retention-days: 7

      - name: Wydanie (z niego telewizor pobiera aktualizacje)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dom 0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: dom-launcher.apk
          make_latest: true
